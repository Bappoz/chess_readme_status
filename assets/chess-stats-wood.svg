  </text>

  <!-- Rapid -->
  <g transform="translate(24, 76)">
    <rect width="200" height="48" fill="#4e342e" rx="6"/>
    <rect width="4" height="48" fill="#ffab91" rx="2"/>
    <text x="16" y="18" fill="#bcaaa4" font-size="11" font-family="Segoe UI, Arial, sans-serif">RAPID</text>
    <text x="16" y="36" fill="#efebe9" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">1148</text>
    <text x="188" y="36" fill="#8d6e63" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="end">56%</text>
  </g>

  <!-- Blitz -->
  <g transform="translate(24, 132)">
    <rect width="200" height="48" fill="#4e342e" rx="6"/>
    <rect width="4" height="48" fill="#ff8a65" rx="2"/>
    <text x="16" y="18" fill="#bcaaa4" font-size="11" font-family="Segoe UI, Arial, sans-serif">BLITZ</text>
    <text x="16" y="36" fill="#efebe9" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">697</text>
    <text x="188" y="36" fill="#8d6e63" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="end">51%</text>
  </g>

  <!-- Bullet -->
  <g transform="translate(24, 188)">
    <rect width="200" height="48" fill="#4e342e" rx="6"/>
    <rect width="4" height="48" fill="#a5d6a7" rx="2"/>
    <text x="16" y="18" fill="#bcaaa4" font-size="11" font-family="Segoe UI, Arial, sans-serif">BULLET</text>
    <text x="16" y="36" fill="#efebe9" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">588</text>
    <text x="188" y="36" fill="#8d6e63" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="end">55%</text>
  </g>

  <!-- Daily -->
  <g transform="translate(24, 244)">
    <rect width="200" height="48" fill="#4e342e" rx="6"/>
    <rect width="4" height="48" fill="#ce93d8" rx="2"/>
    <text x="16" y="18" fill="#bcaaa4" font-size="11" font-family="Segoe UI, Arial, sans-serif">DAILY</text>
    <text x="16" y="36" fill="#efebe9" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">313</text>
    <text x="188" y="36" fill="#8d6e63" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="end">0%</text>
  </g>

  <!-- Stats Panel -->
  <g transform="translate(248, 76)">
    <rect width="208" height="216" fill="#4e342e" rx="6"/>
    
    <text x="16" y="24" fill="#bcaaa4" font-size="11" font-family="Segoe UI, Arial, sans-serif">TOTAL GAMES</text>
    <text x="16" y="48" fill="#efebe9" font-size="24" font-weight="600" font-family="Segoe UI, Arial, sans-serif">1,432</text>
    
    <line x1="16" y1="64" x2="192" y2="64" stroke="#6d4c41"/>
    
    <text x="16" y="88" fill="#bcaaa4" font-size="11" font-family="Segoe UI, Arial, sans-serif">PEAK RATING</text>
    <text x="16" y="112" fill="#d7ccc8" font-size="24" font-weight="600" font-family="Segoe UI, Arial, sans-serif">1203</text>
    
    <line x1="16" y1="128" x2="192" y2="128" stroke="#6d4c41"/>
    
    <text x="16" y="152" fill="#bcaaa4" font-size="11" font-family="Segoe UI, Arial, sans-serif">BEST RATINGS</text>
    <text x="16" y="172" fill="#8d6e63" font-size="11" font-family="Segoe UI, Arial, sans-serif">
      <tspan fill="#ffab91">R</tspan> 1203
      <tspan fill="#ff8a65">B</tspan> 937
      <tspan fill="#a5d6a7">Bu</tspan> 608
    </text>
    
    <text x="16" y="200" fill="#8d6e63" font-size="10" font-family="Segoe UI, Arial, sans-serif">
      Updated Mar 14, 2026
    </text>
