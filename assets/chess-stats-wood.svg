<svg width="480" height="320" xmlns="http://www.w3.org/2000/svg">
  <rect width="480" height="320" fill="#3e2723" rx="8"/>
  <rect x="1" y="1" width="478" height="318" fill="none" stroke="#6d4c41" rx="8"/>

  <!-- Header -->
  <text x="24" y="36" fill="#efebe9" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">
    bappozl
