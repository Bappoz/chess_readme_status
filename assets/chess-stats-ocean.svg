    <text x="16" y="24" fill="#bdc3c7" font-size="11" font-family="Segoe UI, Arial, sans-serif">TOTAL GAMES</text>
    <text x="16" y="48" fill="#ecf0f1" font-size="24" font-weight="600" font-family="Segoe UI, Arial, sans-serif">1,438</text>
    
    <line x1="16" y1="64" x2="192" y2="64" stroke="#2471a3"/>
    
    <text x="16" y="88" fill="#bdc3c7" font-size="11" font-family="Segoe UI, Arial, sans-serif">PEAK RATING</text>
