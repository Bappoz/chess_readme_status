    <text x="16" y="18" fill="#bdc3c7" font-size="11" font-family="Segoe UI, Arial, sans-serif">BULLET</text>
    <text x="16" y="36" fill="#ecf0f1" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">619</text>
    <text x="188" y="36" fill="#85929e" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="end">56%</text>
  </g>

  <!-- Daily -->
  <g transform="translate(24, 244)">
