    <text x="16" y="36" fill="#ecf0f1" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">1206</text>
    <text x="188" y="36" fill="#85929e" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="end">56%</text>
  </g>

  <!-- Blitz -->
  <g transform="translate(24, 132)">
