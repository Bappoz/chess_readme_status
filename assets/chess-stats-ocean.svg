      <tspan fill="#e74c3c">B</tspan> 937
      <tspan fill="#2ecc71">Bu</tspan> 619
    </text>
    
    <text x="16" y="200" fill="#85929e" font-size="10" font-family="Segoe UI, Arial, sans-serif">
