<svg width="480" height="320" xmlns="http://www.w3.org/2000/svg">
  <rect width="480" height="320" fill="#0d1117" rx="8"/>
  <rect x="1" y="1" width="478" height="318" fill="none" stroke="#30363d" rx="8"/>

  <!-- Header -->
