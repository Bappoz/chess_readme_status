      <tspan fill="#da3633">B</tspan> 937
      <tspan fill="#3fb950">Bu</tspan> 619
    </text>
    
    <text x="16" y="200" fill="#6e7681" font-size="10" font-family="Segoe UI, Arial, sans-serif">
