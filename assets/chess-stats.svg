    <text x="16" y="18" fill="#8b949e" font-size="11" font-family="Segoe UI, Arial, sans-serif">RAPID</text>
    <text x="16" y="36" fill="#e6edf3" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">1170</text>
    <text x="188" y="36" fill="#6e7681" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="end">56%</text>
  </g>

  <!-- Blitz -->
  <g transform="translate(24, 132)">
