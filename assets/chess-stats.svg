  <!-- Stats Panel -->
  <g transform="translate(248, 76)">
    <rect width="208" height="216" fill="#161b22" rx="6"/>
    
    <text x="16" y="24" fill="#8b949e" font-size="11" font-family="Segoe UI, Arial, sans-serif">TOTAL GAMES</text>
    <text x="16" y="48" fill="#e6edf3" font-size="24" font-weight="600" font-family="Segoe UI, Arial, sans-serif">1,436</text>
    
    <line x1="16" y1="64" x2="192" y2="64" stroke="#30363d"/>
    
    <text x="16" y="88" fill="#8b949e" font-size="11" font-family="Segoe UI, Arial, sans-serif">PEAK RATING</text>
    <text x="16" y="112" fill="#58a6ff" font-size="24" font-weight="600" font-family="Segoe UI, Arial, sans-serif">1203</text>
    
    <line x1="16" y1="128" x2="192" y2="128" stroke="#30363d"/>
    
    <text x="16" y="152" fill="#8b949e" font-size="11" font-family="Segoe UI, Arial, sans-serif">BEST RATINGS</text>
    <text x="16" y="172" fill="#6e7681" font-size="11" font-family="Segoe UI, Arial, sans-serif">
