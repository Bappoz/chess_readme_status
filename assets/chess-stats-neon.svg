<svg width="480" height="320" xmlns="http://www.w3.org/2000/svg">
  <rect width="480" height="320" fill="#0a0a1a" rx="8"/>
  <rect x="1" y="1" width="478" height="318" fill="none" stroke="#00ffff33" rx="8"/>

  <!-- Header -->
  <text x="24" y="36" fill="#00ffff" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">
    bappozl
  </text>
  <text x="24" y="54" fill="#00cccc" font-size="12" font-family="Segoe UI, Arial, sans-serif">
    Chess.com Stats
  </text>

  <!-- Rapid -->
  <g transform="translate(24, 76)">
    <rect width="200" height="48" fill="#12122a" rx="6"/>
    <rect width="4" height="48" fill="#ffff00" rx="2"/>
    <text x="16" y="18" fill="#00cccc" font-size="11" font-family="Segoe UI, Arial, sans-serif">RAPID</text>
    <text x="16" y="36" fill="#00ffff" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">1188</text>
    <text x="188" y="36" fill="#008888" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="end">56%</text>
  </g>

  <!-- Blitz -->
  <g transform="translate(24, 132)">
    <rect width="200" height="48" fill="#12122a" rx="6"/>
    <rect width="4" height="48" fill="#ff0066" rx="2"/>
    <text x="16" y="18" fill="#00cccc" font-size="11" font-family="Segoe UI, Arial, sans-serif">BLITZ</text>
    <text x="16" y="36" fill="#00ffff" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">697</text>
    <text x="188" y="36" fill="#008888" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="end">51%</text>
  </g>

  <!-- Bullet -->
  <g transform="translate(24, 188)">
    <rect width="200" height="48" fill="#12122a" rx="6"/>
    <rect width="4" height="48" fill="#00ff66" rx="2"/>
    <text x="16" y="18" fill="#00cccc" font-size="11" font-family="Segoe UI, Arial, sans-serif">BULLET</text>
    <text x="16" y="36" fill="#00ffff" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">601</text>
    <text x="188" y="36" fill="#008888" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="end">55%</text>
  </g>

  <!-- Daily -->
  <g transform="translate(24, 244)">
    <rect width="200" height="48" fill="#12122a" rx="6"/>
    <rect width="4" height="48" fill="#cc66ff" rx="2"/>
    <text x="16" y="18" fill="#00cccc" font-size="11" font-family="Segoe UI, Arial, sans-serif">DAILY</text>
    <text x="16" y="36" fill="#00ffff" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif">313</text>
    <text x="188" y="36" fill="#008888" font-size="12" font-family="Segoe UI, Arial, sans-serif" text-anchor="end">0%</text>
  </g>

  <!-- Stats Panel -->
  <g transform="translate(248, 76)">
    <rect width="208" height="216" fill="#12122a" rx="6"/>
    
    <text x="16" y="24" fill="#00cccc" font-size="11" font-family="Segoe UI, Arial, sans-serif">TOTAL GAMES</text>
    <text x="16" y="48" fill="#00ffff" font-size="24" font-weight="600" font-family="Segoe UI, Arial, sans-serif">1,442</text>
    
    <line x1="16" y1="64" x2="192" y2="64" stroke="#00ffff33"/>
    
    <text x="16" y="88" fill="#00cccc" font-size="11" font-family="Segoe UI, Arial, sans-serif">PEAK RATING</text>
    <text x="16" y="112" fill="#ff00ff" font-size="24" font-weight="600" font-family="Segoe UI, Arial, sans-serif">1206</text>
    
    <line x1="16" y1="128" x2="192" y2="128" stroke="#00ffff33"/>
    
    <text x="16" y="152" fill="#00cccc" font-size="11" font-family="Segoe UI, Arial, sans-serif">BEST RATINGS</text>
    <text x="16" y="172" fill="#008888" font-size="11" font-family="Segoe UI, Arial, sans-serif">
      <tspan fill="#ffff00">R</tspan> 1206
      <tspan fill="#ff0066">B</tspan> 937
      <tspan fill="#00ff66">Bu</tspan> 656
    </text>
    
    <text x="16" y="200" fill="#008888" font-size="10" font-family="Segoe UI, Arial, sans-serif">
      Updated May 14, 2026
    </text>
  </g>
</svg>