name: 📊 Update Chess.com Stats

on:
  # Atualiza automaticamente a cada 6 horas (4x por dia)
  schedule:
    - cron: "0 */6 * * *"

  # Permite executar manualmente pelo GitHub
  workflow_dispatch:

  # Executa também quando há push na branch main (para testes)
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  update-stats:
    name: Gerar SVG de Estatísticas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Garantir que pegamos a branch correta
          ref: ${{ github.ref }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Instalar dependências
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        timeout-minutes: 5

      - name: 🎨 Gerar SVG com estatísticas
        env:
          CHESS_USERNAME: ${{ vars['CHESS_USERNAME'] }}
          CHESS_THEME: ${{ vars['CHESS_THEME'] }}
        run: |
          echo "Starting stats generation..."
          npm run generate
          echo "Stats generation completed!"
        timeout-minutes: 5
        continue-on-error: false

      - name: 📊 Verificar mudanças
        id: verify-changes
        run: |
          if git diff --quiet assets/chess-stats.svg; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in SVG files"
            git diff --stat assets/
          fi

      - name: 💾 Commit e Push
        if: steps.verify-changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/*.svg 2>/dev/null || true
          git add assets/.cache.json 2>/dev/null || true
          git commit -m "📊 Atualiza estatísticas do Chess.com [skip ci]" || exit 0

          # Tentar push com retry
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Push attempt $attempt of $max_attempts..."
            if git push; then
              echo "Push successful!"
              exit 0
            fi
            echo "Push failed, retrying in 5 seconds..."
            sleep 5
            git pull --rebase
            attempt=$((attempt + 1))
          done

          echo "Failed to push after $max_attempts attempts"
          exit 1

      - name: ✅ Finalizado
        if: steps.verify-changes.outputs.changed == 'true'
        run: |
          echo "✅ Estatísticas atualizadas com sucesso!"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

      - name: ℹ️ Sem mudanças
        if: steps.verify-changes.outputs.changed != 'true'
        run: |
          echo "ℹ️ Nenhuma mudança detectada nas estatísticas"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

      - name: 🚨 Workflow falhou
        if: failure()
        run: |
          echo "❌ Erro ao atualizar estatísticas!"
          echo "Verifique os logs acima para mais detalhes"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          exit 1
