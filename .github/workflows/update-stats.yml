name: 📊 Update Chess.com Stats

on:
  # Atualiza automaticamente a cada 6 horas (4x por dia)
  schedule:
    - cron: "0 */6 * * *"

  # Permite executar manualmente pelo GitHub
  workflow_dispatch:

  # Executa também quando há push na branch main (para testes)
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/**"

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update-stats:
    name: Gerar SVG de Estatísticas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Garantir que pegamos a branch correta
          ref: ${{ github.ref }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Instalar dependências
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        timeout-minutes: 5

      - name: 🎨 Gerar SVG com estatísticas
        env:
          CHESS_USERNAME: ${{ vars.CHESS_USERNAME }}
        run: |
          if [ -z "$CHESS_USERNAME" ]; then
            echo "::warning::CHESS_USERNAME não está definido em Settings → Variables; usando o fallback do script."
          fi
          npm run generate 2>&1 | tee /tmp/generate.log
          # tee mascara o status do node; sem isso a falha da API passa batido.
          exit "${PIPESTATUS[0]}"
        timeout-minutes: 5

      - name: 📊 Verificar mudanças
        id: verify-changes
        run: |
          # git add antes do diff: --cached também enxerga arquivo novo
          # (estilo/modo novo), que `git diff` sozinho ignoraria.
          git add -A assets/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --cached --stat
          fi

      - name: 🧾 Resumo do run
        if: always()
        run: |
          {
            echo "### Dados puxados da API"
            echo '```'
            grep -E "^User:|Rapid:|Total games loaded:|data points" /tmp/generate.log 2>/dev/null \
              || echo "gerador não chegou a produzir saída"
            echo '```'
            case "${{ steps.verify-changes.outputs.changed }}" in
              true)  echo "**SVGs alterados** — commit feito." ;;
              false) echo "**Sem alteração** — a API respondeu, mas ratings e histórico continuam iguais ao último commit." ;;
              *)     echo "**Falha antes da comparação** — veja os logs do passo de geração." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 💾 Commit e Push
        if: steps.verify-changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # assets/ já foi staged no passo de verificação.
          git commit -m "📊 Atualiza estatísticas do Chess.com [skip ci]"

          # Tentar push com retry
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Push attempt $attempt of $max_attempts..."
            if git push; then
              echo "Push successful!"
              exit 0
            fi
            echo "Push failed, retrying in 5 seconds..."
            sleep 5
            git pull --rebase
            attempt=$((attempt + 1))
          done

          echo "Failed to push after $max_attempts attempts"
          exit 1

      - name: ✅ Finalizado
        if: steps.verify-changes.outputs.changed == 'true'
        run: |
          echo "✅ Estatísticas atualizadas com sucesso!"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

      - name: ℹ️ Sem mudanças
        if: steps.verify-changes.outputs.changed != 'true'
        run: |
          echo "ℹ️ Nenhuma mudança detectada nas estatísticas"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

      - name: 🚨 Workflow falhou
        if: failure()
        run: |
          echo "❌ Erro ao atualizar estatísticas!"
          echo "Verifique os logs acima para mais detalhes"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          exit 1
